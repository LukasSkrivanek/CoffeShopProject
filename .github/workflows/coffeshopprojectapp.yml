name: iOS Fastlane CI

on:
  pull_request:
    branches: [ "feature/ui_kit", "main", "feature/ui_kit_main" ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1.0'
          bundler-cache: true
      
      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Mint
        run: brew install mint

      - name: Cache Mint modules
        id: cache-mint
        uses: actions/cache@v4
        env:
          cache-name: cache-mint-modules
        with:
          path: ~/.mint
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/Mintfile') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - if: ${{ steps.cache-mint.outputs.cache-hit != 'true' }}
        name: List the state of Mint modules
        continue-on-error: true
        run: mint list

      - name: mint bootstrap
        run: mint bootstrap

      - name: CocoaPods
        run: bundle exec pod install

      - name: Run Fastlane build_and_test
        run: bundle exec fastlane ios build_and_test
