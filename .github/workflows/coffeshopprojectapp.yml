name: iOS Fastlane CI

on:
  pull_request:
    branches: [ "feature/ui_kit", "main", "feature/ui_kit_main" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.6'
          bundler-cache: true
          
      - name: Install Bundler
        run: gem install bundler:1.17.3
      
      - name: Bundle Install
        run: bundle install
      
      - name: CocoaPods
        run: bundle exec pod install

      - name: Run Fastlane build_and_test
        run: bundle exec fastlane ios build_and_test
