name: iOS starter workflow

on:
  pull_request:
    branches: [ "feature/ui_kit", "main" ]

jobs:
  build:
    name: Build and Test default scheme using any available iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: 16.2
      - name: Build and test
        run: xcodebuild build -project Coffe.xcodeproj -scheme Coffe -destination "platform=iOS Simulator,OS=18.1,name=iPhone 16"
